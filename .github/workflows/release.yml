name: Release

# Push a tag such as v0.2.0 that matches package.json's version. To rebuild an existing release,
# run this workflow manually and choose that tag under "Use workflow from".
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Require a tag matching package.json
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$REF_TYPE" != tag ] || [ "$REF_NAME" != "$expected" ]; then
            echo "::error::Release from the tag $expected, not the $REF_TYPE $REF_NAME"
            exit 1
          fi

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - run: npm ci
      - run: npm test

      # beforeBuildCommand compiles and stages the service and Node.js runtime. The bundle is
      # ad-hoc signed (signingIdentity "-") and not notarized; the updater artifacts
      # (.app.tar.gz, .sig, latest.json) are signed with the updater key.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Nootify v__VERSION__
          releaseBody: >-
            Apple Silicon build. It is ad-hoc signed and not notarized: on first launch,
            allow it under System Settings > Privacy & Security. Installed copies update
            themselves from the latest release.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target aarch64-apple-darwin --bundles app,dmg
