name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      NOOTIFY_BUILD_TARGET: ${{ matrix.target }}
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
          cache: npm

      - uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            desktop/go.sum
            native/tailscale/go.sum
            native/core/go.sum

      - name: Test embedded Tailscale client
        working-directory: native/tailscale
        run: go test ./...

      - name: Test notification provider core
        working-directory: native/core
        run: go test ./...

      - name: Test and vet MyGo desktop module
        working-directory: desktop
        run: |
          go test ./...
          go vet ./...

      - run: npm ci

      - name: Probe native Windows installer hooks
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: powershell
        run: .\scripts\windows-installer-hook-smoke.ps1

      - name: Upload Windows installer hook diagnostics
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-hook-diagnostics
          path: .cache/windows-installer-hook-smoke/
          if-no-files-found: ignore
          retention-days: 7

      - name: Run tests with deadlines and JUnit output
        timeout-minutes: 10
        run: npm test
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-tests-${{ matrix.target }}
          path: .cache/test-results.xml
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run check

      # Fail on real Task Scheduler lifecycle issues before staging or native builds.
      - name: Probe the real Windows service task lifecycle
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: powershell
        run: .\scripts\windows-task-smoke.ps1

      - name: Upload Windows task lifecycle diagnostics
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-task-lifecycle-diagnostics
          path: |
            .cache/windows-task-smoke/diagnostics.json
            .cache/windows-task-smoke/*.stdout.log
            .cache/windows-task-smoke/*.stderr.log
            .cache/windows-task-smoke/fixture-stdout.log
            .cache/windows-task-smoke/fixture-stderr.log
          if-no-files-found: ignore
          retention-days: 7

      # Real staging validates the pinned runtime, PE/Mach-O architecture,
      # Windows task resources, production lockfile, and embedded tsnet build.
      - name: Cache the Node.js runtime download
        uses: actions/cache@v6
        with:
          path: .cache/node
          key: node-runtime-${{ matrix.target }}-${{ hashFiles('scripts/build-targets.mjs', 'scripts/stage-service.mjs') }}
      # CI has no release signing key. Build the actual app/NSIS payload so
      # installer hooks, ICO, sidecar layout and platform config are validated.
      - name: Build desktop bundle without updater signing
        run: npm run desktop:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --no-sign --ci

      - name: Smoke test the native MyGo app with an isolated identity
        timeout-minutes: 2
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == Windows ]]; then
            build/desktop/${{ matrix.target }}/payload/Nootify.exe --smoke-test
          else
            build/desktop/${{ matrix.target }}/macos/Nootify.app/Contents/MacOS/Nootify --smoke-test
          fi

      - name: Preserve current Windows installer
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $null = New-Item -ItemType Directory -Force .cache/windows-current-installer
          Copy-Item "build/desktop/x86_64-pc-windows-msvc/nsis/Nootify_${version}_x64-setup.exe" .cache/windows-current-installer/

      # Same sources, older package version: exercise a real cross-version /UPDATE
      # without depending on an existing Windows release or any signing secret.
      - name: Build baseline Windows installer fixture
        if: runner.os == 'Windows'
        run: npm run desktop:build -- --target ${{ matrix.target }} --bundles nsis --package-version 0.0.0 --no-sign --ci

      - name: Test Windows installation, upgrade and uninstall
        if: runner.os == 'Windows'
        timeout-minutes: 12
        shell: powershell
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $bundles = 'build/desktop/x86_64-pc-windows-msvc/nsis'
          .\scripts\windows-install-smoke.ps1 `
            -Installer (Join-Path '.cache/windows-current-installer' "Nootify_${version}_x64-setup.exe") `
            -BaselineInstaller (Join-Path $bundles 'Nootify_0.0.0_x64-setup.exe') `
            -Version $version

      - name: Upload Windows installation diagnostics
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-installation-diagnostics
          path: .cache/windows-install-smoke/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload unsigned Windows installer
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v7
        with:
          name: nootify-windows-x64-installer
          path: .cache/windows-current-installer/*.exe
          if-no-files-found: ignore
          retention-days: 7
